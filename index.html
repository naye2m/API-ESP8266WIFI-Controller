<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP8266 API Controller</title>
    <style>
        :root {
            --GRAY3: #333;
            --brand-hue: 211;
            --btn-bg: hsl(var(--brand-hue), 100%, 50%);
            --btn-bg-hover: hsl(var(--brand-hue), 100%, 35%);
            --off-white: #ddd;
            --white99: #f8f9fa;
            --white: white;
            --black: black;
            --brand-warning: hsl(16, 100%, 50%);
            --brand-warning-dark: hsl(16, 100%, 20%);
            --brand-warning-light: hsl(16, 100%, 75%);
        }

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            color: var(--GRAY3);
        }

        .container {
            margin-top: 20px;
        }

        .section {
            margin-bottom: 20px;
        }

        button,
        .button {
            margin: 5px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: var(--btn-bg);
            color: var(--white);
            cursor: pointer;
        }

        .button:hover {
            background-color: var(--btn-bg-hover);
        }

        input[type="text"],
        input[type="number"],
        select {
            margin: 5px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid var(--off-white);
        }

        textarea {
            margin: 5px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid var(--off-white);
            width: 100%;
            height: 100px;
        }

        .response {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid var(--off-white);
            border-radius: 5px;
            background-color: var(--white99);
        }

        canvas {
            border: 5px solid var(--black);
            margin: 0 auto;
            box-sizing: border-box;
            display: block;
            padding: 3px;
            background: #ccc;
        }

        #output {
            border: 2px solid var(--black);
            background-color: var(--off-white);
            color: var(--GRAY3);
            border-radius: 5vw;
            padding: 2vw;
        }

        #output.error {
            border-color: currentColor solid;
            background-color: var(--brand-warning-light);
            color: var(--brand-warning-dark);
        }
    </style>
</head>

<body>
    <h1>ESP8266 API Controller</h1>
    <div class="container">
        <div id="output" class=""></div>
        <div class="section">
            <h2>LED Control</h2>
            <button class="button" onclick="sendRequest('/led/on')">Turn LED On</button>
            <button class="button" onclick="sendRequest('/led/off')">Turn LED Off</button>
            <br>
            <input type="number" id="blinktimes">
            <button class="button"
                onclick="sendRequest('/led/blink?times='+(document.getElementById('blinktimes').value | 5 ))">Blink
                LED</button>
            <input type="number" id="ledBrightness" placeholder="Brightness (0-255)">
            <button class="button" onclick="setLEDBrightness()">Set LED Brightness</button>
        </div>
        <div class="section">
            <h2>Display Control</h2>
            <textarea id="displayText" placeholder="Enter text to display"></textarea>
            <input type="number" id="textSize" placeholder="Text Size (1-3)">
            <input type="number" id="textX" placeholder="X Position">
            <input type="number" id="textY" placeholder="Y Position">
            <button class="button" onclick="displayText()">Display Text</button>
            <button class="button" onclick="sendRequest('/cleanDisplay')">Clear Display</button>
            <input type="checkbox" id="clearBeforeRender"> Clear Before Render
            <button class="button" onclick="setClearBeforeRender()">Set Clear Before Render</button>
        </div>
        <div class="section">
            <h2>Pixel Control</h2>
            <input type="number" id="pixelX" placeholder="X Position">
            <input type="number" id="pixelY" placeholder="Y Position">
            <input type="number" id="pixelState" placeholder="State (0=Off, 1=On)">
            <button class="button" onclick="setPixel()">Set Pixel</button>
        </div>
        <div class="section">
            <h2>Shape Drawing</h2>
            <select id="shapeType">
                <option value="rect" onselect="shapeH.hidden = false">Rectangle</option>
                <option value="circle" onselect="shapeH.hidden = true">Circle</option>
            </select>
            <input type="number" id="shapeX" placeholder="X Position">
            <input type="number" id="shapeY" placeholder="Y Position">
            <input type="number" id="shapeW" placeholder="Width/Radius">
            <input type="number" id="shapeH" placeholder="Height (only for rectangle)">
            <button class="button" onclick="drawShape()">Draw Shape</button>
        </div>
        <div class="section">
            <h2>Text Animation</h2>
            <textarea id="animateText" placeholder="Enter text to animate"></textarea>
            <input type="number" id="animateSize" placeholder="Text Size (1-3)">
            <input type="number" id="animateY" placeholder="Y Position">
            <input type="number" id="animateRepeats" placeholder="Repeats (1-10)">
            <button class="button" onclick="animateText()">Animate Text</button>
        </div>
        <div class="section">
            <h2>2D Array Control</h2>
            <textarea id="displayArray" placeholder="Enter 128x64 array data as a binary string"></textarea>
            <button class="button" onclick="set2DArray()">Set 2D Array</button>
        </div>
        <div class="section">
            <h2>Upload an Image and Display it on Canvas</h2>

            <input type="file" id="imageInput" accept="image/*">

            <br><br>
           <legend>
                input canvas
                <canvas id="cking_canvas" width="128" height="64"></canvas>
            </legend>
            <label for="canvasOnloadCleanPrevious">Clean Before Loading</label>
            <input type="checkbox" name="canvasOnloadCleanPrevious" id="canvasOnloadCleanPrevious">
            <br>
            <button id="inputCanvas" onclick="setCanvas(cking_canvas, window.canvasOnloadCleanPrevious.checked)">
                Copy input canvas to draw canvas</button>
           <h2>Draw on Canvas</h2>
            <canvas id="drawCanvas" width="128" height="64"></canvas>
            <br>
            <select name="savedCanvasSelector" id="savedCanvasSelector">
                <option value="" disabled selected>select</option>
            </select>
            <br>
            <label for="canvasOnloadCleanPrevious">Clean Before Loading: </label>
            <input type="checkbox" name="canvasOnloadCleanPrevious" id="canvasOnloadCleanPrevious">
            <br>
            <button onclick="savedCanvases.set2canvas()">Set Data</button>
            <button onclick="savedCanvases.save()">Save Data</button>
            <br><br>
            <button onclick="ctx.fillRect(0,0,128,16)">Lit down Yellow part</button>
            <button onclick="ctx.fillRect(0,16,128,64)">Lit down Blue part</button>
            <button onclick="cleanCanvas()">Clear Canvas</button>
            <br>
            <select name="sendDataBitModifier" id="sendDataBitModifier"></select>
            <button onclick="sendBytearrData()">Send Canvas Data</button>
            <br><br>
            <div id="canvasFilter">
                <label for="filterSelector">Select Filter:</label>
                <select id="filterSelector"> </select>
                apply filter: <button onclick="applyFilterToCanvas()">Apply</button>
           </div>
        </div>

        <div class="section">
            <h2>Func functionality</h2>
            <select id="func__funcname">
                <option value="disp">disp</option>
                <option value="ledBlink">ledBlink</option>
                <option value="ledBrightness">ledBrightness</option>
                <option value="pixel">pixel</option>
                <option value="shape">shape</option>
                <option value="animateText">animateText</option>
                <option value="2DArray">2DArray</option>
                <option value="clearBeforeRender">clearBeforeRender</option>
                <option value="qr">qr</option>
                <option value="bytearray">bytearray</option>
                <option value="serialprint">serialprint</option>
                <option value="bytearr" selected>bytearr</option>
            </select>
            <input id="func__funcbody" type="text" placeholder="{helptext : 'body of function'}">
            <button onclick="sendfunc()">Send Canvas Data</button>
        </div>
    </div>
    <script>
        //  global consts
        const ERROR_CODE = 1;
        const SUCCESS_CODE = 0;
    </script>
    <script>
        "use strict";

        window.autoupdate = true;
        <!-- canvas -->
        const _C = document.getElementById('drawCanvas');
        const ctx = _C.getContext('2d');
        let show_res = serverOut;
        function serverOut(OUTPUT_CODE, ...texts) {
            console.log(OUTPUT_CODE, ...texts)
            let error = OUTPUT_CODE;
            let text = "";
            if (error)
                text += "ERROR : \n";
            text += texts.map(e => typeof e == "string" ? e : JSON.stringify(e)).join("\n");
            // alert(text)
            let output = document.getElementById("output");
            output.innerText = text;
            if (error)
                output.classList.add("error")
            else
                output.classList.remove("error")
        }
        async function func(b) {
            console.log(b);
            return await sendRequest("/func", "POST", b);
        }
        async function sendRequest(endpoint, method = 'GET', body = null, outfunc = serverOut) {
            if (!window.chengedEndpoint && (window.location.host.startsWith("127.0.0.1") || window.location.host.startsWith("localhost")))
                window.chengedEndpoint = prompt("enter endpoint", "http://192.168.4.1") + endpoint;
            endpoint = window.chengedEndpoint || endpoint;
            let options = { method };
            if (body) {
                options.headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
                options.body = new URLSearchParams(body).toString();
            }
            try {
                const response = await fetch(endpoint, options);
                const data = await response.text();
                outfunc(0, data);  // Display response in an alert box
            } catch (error) {
                outfunc(1, error, "endpoint : ", endpoint, "options : ", options);
            }
        }
        function setLEDBrightness() {
            const brightness = document.getElementById('ledBrightness').value;
            if (brightness == '')
                return show_res(1, "Brightness value is empty.")
            brightness = parseInt(brightness);
            if (brightness > 0xff)
                brightness = 0xff;
            if (brightness < 0x0)
                brightness = 0x0;
            sendRequest('/led/brightness', 'POST', { level: brightness });
        }
        let cleanCanvas = () => ctx?.clearRect(0, 0, _C.width, _C.height);
        const savedCanvases = {
            getNames() {
                return Object.entries(savedCanvases).filter(
                    e => typeof e[1] == 'string' && e[1]?.startsWith("data:image/png;base64,")
                ).map(e => e[0]);
                //return Object.keys(this).filter(e => !['getNames', 'getByIndex', 'getByName', 'save', 'set', 'getHTMLobj', 'canvasSelectorElem', 'iscleanElem', 'updateUI', 'set2canvas', 'loadsaved'].includes(e));

            },

            getByIndex(i) {
                return this.getNames()[i];
            },

            getByName(name) {
                let imageData = this[name];
                if (imageData) return imageData;

                let names = this.getNames();
                while (names.length >= 2) {
                    names = names.filter(e => e.includes(prompt(
                        "Enter part of search\n" + names.map((e, i) => `${i}. ${e}`).join("\n")
                    )));
                }
                if (!names.length) return show_res(ERROR_CODE, `No Saved Image found by given name`) || undefined;
                return this[names[0]];
            },

            save() {
                let timestamp = new Date().toJSON();
                let name = prompt("Input Canvas name (for saving).", "Untitled") ?? "Untitled";
                name += " - " + timestamp;
                let datanow = _C.toDataURL();
                this[name] = datanow;
                this.updateUI();

                let savedInLocalStorage = JSON.parse(localStorage.getItem("savedCanvases") || "{}");
                savedInLocalStorage[name] = datanow;
                localStorage.setItem("savedCanvases", JSON.stringify(savedInLocalStorage));

                // Optional success message:
                // return show_res(SUCCESS_CODE, `Saved Image ${name} successfully`);
            },

            loadsaved() {
                let savedInLocalStorage = JSON.parse(localStorage.getItem("savedCanvases") || "{}");
                let names = Object.keys(savedInLocalStorage);
                if (names.length === 0) return show_res(ERROR_CODE, `No Saved Image found`);

                // Load all saved canvases into this object
                for (let savedName in savedInLocalStorage) {
                    this[savedName] = savedInLocalStorage[savedName];
                }

                // Assume the last saved name is the default one to load
                // this.set(names[names.length - 1], true);
                this.updateUI();
            },

            set(name, isclean = true, x = 0, y = 0) {
                let dataUrl = this.getByName(name);
                if (!dataUrl) return show_res(ERROR_CODE, `No Saved Image named ${name} found`);

                if (isclean) cleanCanvas();

                const img = new Image();
                img.onload = function (...args) {
                    console.log(args);
                    const ctx = _C.getContext('2d');
                    ctx.drawImage(img, x, y);
                };
                img.src = dataUrl;

                return show_res(
                    SUCCESS_CODE,
                    `masked ${name} and ${isclean ? "cleaned" : "kept"} old data`
                );
            },

            getHTMLobj() {
                return '<option value="" disabled selected>select</option>' + this.getNames()
                    .map((e, i) => {
                        let options = document.createElement("option");
                        options.value = e;
                        options.textContent = "" + (i + 1) + " . " + e;
                        return options.outerHTML;
                    }).join("");
            },

            canvasSelectorElem: document.getElementById("savedCanvasSelector"),
            iscleanElem: document.getElementById("canvasOnloadCleanPrevious"),

            updateUI() {
                this.canvasSelectorElem.innerHTML = this.getHTMLobj();
            },

            set2canvas() {
                this.set(this.canvasSelectorElem.value, this.iscleanElem.checked);
            }
        };

        // Call loadsaved to load any saved canvases on initial page load
        savedCanvases.loadsaved();
        function displayText() {
            const text = document.getElementById('displayText').value;
            const size = document.getElementById('textSize').value;
            const x = document.getElementById('textX').value;
            const y = document.getElementById('textY').value;
            const params = {
                plain: text,
                size: size,
                x: x,
                y: y
            };
            sendRequest('/display', 'POST', params);
        }
        function setClearBeforeRender() {
            const clear = document.getElementById('clearBeforeRender').checked;
            sendRequest('/clearBeforeRender', 'POST', { clear: clear });
        }
        function setPixel() {
            const x = document.getElementById('pixelX').value;
            const y = document.getElementById('pixelY').value;
            const state = document.getElementById('pixelState').value;
            if (x !== '' && y !== '' && state !== '') {
                const params = {
                    x: x,
                    y: y,
                    state: state
                };
                sendRequest('/pixel', 'POST', params);
            }
        }
        function drawShape() {
            const type = document.getElementById('shapeType').value;
            const x = document.getElementById('shapeX').value;
            const y = document.getElementById('shapeY').value;
            const w = document.getElementById('shapeW').value;
            const h = document.getElementById('shapeH').value;
            let params = '';
            if (type === 'rect') {
                if (x !== '' && y !== '' && w !== '' && h !== '') {
                    params = {
                        type: 'rect',
                        x: x,
                        y: y,
                        w: w,
                        h: h
                    };
                }
            } else if (type === 'circle') {
                if (x !== '' && y !== '' && w !== '') {
                    params = {
                        type: 'circle',
                        x: x,
                        y: y,
                        r: w
                    };
                }
            }
            if (params) {
                sendRequest('/shape', 'POST', params);
            }
        }
        function animateText() {
            const text = document.getElementById('animateText').value;
            const size = document.getElementById('animateSize').value;
            const y = document.getElementById('animateY').value;
            const repeats = document.getElementById('animateRepeats').value;
            if (text !== '') {
                const params = {
                    text: text,
                    size: size,
                    y: y,
                    repeats: repeats
                };
                sendRequest('/animateText', 'POST', params);
            }
        }
        function set2DArray() {
            const arrayData = document.getElementById('displayArray').value;
            if (arrayData !== '') {
                const params = { plain: arrayData };
                sendRequest('/setArray', 'POST', params);
            }
        }
        function getCurrentCanvasImageData() {
            return ctx.getImageData(0, 0, _C.width, _C.height, {
                // "colorSpace": "display-p3", 
                "willReadFrequently": true
            });
        }
        // let td = new TextDecoder();
        // let td = new TextDecoder("latin1")
        const charset = Array(0x100).fill().map((e, i) => String.fromCharCode(i)).join("");
        let code2char = n => charset[n];
        // both are same
        // let td = new TextDecoder("ISO-8859-1")
        const pixelCalculators = {
            alpha: (rgbaData) => rgbaData[3],
            red: (rgbaData) => rgbaData[0],
            green: (rgbaData) => rgbaData[1],
            blue: (rgbaData) => rgbaData[2],
            luminance: (rgbaData) => {
                const [r, g, b, a] = rgbaData.map(e => e / 255);
                const luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                return luminance * 255;
            },
            grayscale: (rgbaData) => {
                const grayscale = (rgbaData[0] + rgbaData[1] + rgbaData[2]) / 3;
                return grayscale * 255;
            },
       };

        function canvas2ASCII(pixelValFunc = pixelCalculators.luminance, threshold = 128, displayArea = 128 * 64) {
            applyBWdithering(_C);
            let tmp = pixelValFunc
            pixelValFunc = e => Math.floor(tmp(e));
            const BYTE_LENGTH = 8;  // Number of bits per byte
            let imageData = getCurrentCanvasImageData().data;  // Get the current image data from the canvas

            // Calculate the number of pixels painted (non-transparent)
            let paintedPixelsCount = imageData.reduce((sum, value, index) => {
                // Check if pixel's alpha value is greater than 1 (i.e., pixel is not fully transparent)
                //return sum + (imageData[index * 4 + 3] > 1);  // Alpha channel is at index * 4 + 3
                return sum + (pixelValFunc(imageData.slice(index * 4, (index + 1) * 4)));  // Alpha channel is at index * 4 + 3
            }, 0);

            let pixelArray = Array(displayArea);  // Create an array to store pixel values

            // Extract the alpha channel values (transparency) for each pixel
            for (let pixelIndex = 0; pixelIndex < displayArea; pixelIndex++) {
                // pixelArray[pixelIndex] = imageData[pixelIndex * 4 + 3];  // Store alpha value (transparency)
                let rgbaData = imageData.slice(pixelIndex * 4, pixelIndex * 4 + 4);
                pixelArray[pixelIndex] = pixelValFunc(rgbaData);  // Store alpha value (transparency)
            }

            // Create a new array to hold reduced pixel data (converted to bytes)
            let reducedArray = new Uint8Array(displayArea / BYTE_LENGTH);

            // Convert the pixel data to ASCII representation
            for (let i = 0; i < reducedArray.length; i++) {
                reducedArray[i] = Array(BYTE_LENGTH).fill().reduce((byteSum, _, bitPos) => {
                    // Check if the pixel's alpha value exceeds the threshold and convert to 1 or 0
                    return byteSum | ((pixelArray[i * BYTE_LENGTH + bitPos] > threshold)
                        ? (1 << (BYTE_LENGTH - (bitPos + 1)))
                        : 0);  // Set corresponding bit based on threshold
                }, 0);
            }

            // Convert the byte array to a string and replace control characters
            let asciiString = String.fromCharCode(...reducedArray);

            // Clean up the string: Remove unnecessary null characters and handle special cases
            asciiString = asciiString.replace(/\x00{0,}$/g, "")  // Remove trailing null characters
                .replaceAll("\x10", "\x08")  // Convert \x10 to backspace
                .replaceAll("\x00", "\x10");  // Convert \x00 to space for readability

            return asciiString;
        }
        const uint8ArrayToBase64 = (uint8Array) => {
            // Convert Uint8Array to Base64 string
            let binaryString = '';
            const len = uint8Array.length;
            for (let i = 0; i < len; i++) {
                binaryString += String.fromCharCode(uint8Array[i]);
            }
            return window.btoa(binaryString);
        };
        function sendfunc() {
            let f = {
                name: document.getElementById("func__funcname").value,
                body: document.getElementById("func__funcbody").value,
            }
            f.json = JSON.parse(f.body);
            if (!(f.json?.toString() == '[object Object]')) {
                return alert("funcbody is not an object;")
            }
            document.getElementById("func__funcbody").value = JSON.stringify(f.json);
            f.json["func"] = f.name;
            func(f.json);
        }
    </script>

    <script>
        // Handle mouse and touch events for drawing
        _C.addEventListener('mousedown', startDrawing);
        _C.addEventListener('mouseup', stopDrawing);
        _C.addEventListener('blur', stopDrawing);
        _C.addEventListener('mouseleave', stopDrawing);
        _C.addEventListener('mousemove', draw);
        _C.addEventListener('touchstart', startDrawing, { passive: false });
        _C.addEventListener('touchend', stopDrawing);
        _C.addEventListener('touchcancel', stopDrawing);
        _C.addEventListener('touchmove', draw, { passive: false });

        let drawing = false; // Make sure we define this flag
        function startDrawing(e) {
            e.preventDefault(); // Prevent default touch behavior (like scrolling)
            drawing = true;
            ctx.beginPath();
            ctx.moveTo(getX(e), getY(e));
        }
        function stopDrawing() {
            drawing = false;
            ctx.closePath();
        }
        function draw(e) {
            e.preventDefault(); // Prevent scrolling
            if (!drawing) return;
            ctx.lineTo(getX(e), getY(e));
            ctx.stroke();
        }
        // Get X coordinate based on event type (mouse or touch)
        function getX(e) {
            if (e.type.includes('touch')) {
                return e.touches[0].pageX - _C.clientLeft - _C.offsetLeft;
            }
            return e.offsetX;
        }
        // Get Y coordinate based on event type (mouse or touch)
        function getY(e) {
            if (e.type.includes('touch')) {
                return e.touches[0].pageY - _C.clientTop - _C.offsetTop;
            }
            return e.offsetY;
        }

        function sendBytearrData() {
            const byteArray = canvas2ASCII();
            // sendRequest('/setBinArray', 'POST', { ByteArray: byteArray });
            func({ "func": "bytearr", "data": byteArray, "clear": "", "escape_char": 16 });
        }
    </script>

    <script>
        const cking_canvas = document.getElementById("cking_canvas");
        <!-- drawCanvas -->
        const dC = document.getElementById("drawCanvas");
        const ckctx = cking_canvas.getContext("2d");
        const drawCtx = dC.getContext("2d");
        const imageInput = document.getElementById("imageInput");

        imageInput.addEventListener("change", function (event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = new Image();
                    img.onload = function () {
                        // Clear the canvas before drawing the image
                        ckctx.clearRect(0, 0, cking_canvas.width, cking_canvas.height);
                        const imgAspectRatio = img.width / img.height;
                        let newWidth = cking_canvas.width;
                        let newHeight = cking_canvas.height;
                        if (img.width / img.height > cking_canvas.width / cking_canvas.height) {
                            newWidth = cking_canvas.width;
                            newHeight = newWidth / imgAspectRatio;
                        } else {
                            newHeight = cking_canvas.height;
                            newWidth = newHeight * imgAspectRatio;
                        }
                        const x = (cking_canvas.width - newWidth) / 2;
                        const y = (cking_canvas.height - newHeight) / 2;
                        ckctx.drawImage(img, x, y, newWidth, newHeight);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function setCanvas(canvasToCopy, clean = true) {
            if (clean)
                drawCtx.clearRect(0, 0, dC.width, dC.height); // Clear the draw canvas before copying

            drawCtx.drawImage(canvasToCopy, 0, 0); // Copy the image from cking_canvas to drawCanvas
        }

        // Apply selected filter to the drawCanvas
        const filters = {
            grayscale: function (rgbaData) {
                const [r, g, b, a] = rgbaData;
                const gray = 0.3 * r + 0.59 * g + 0.11 * b;
                return [gray, gray, gray, a];
            },
            sepia: function (rgbaData) {
                const [r, g, b, a] = rgbaData;
                const sepia = 0.393 * r + 0.769 * g + 0.189 * b;
                return [Math.min(255, Math.max(0, sepia + 100)), Math.min(255, Math.max(0, sepia + 50)), Math.min(255, Math.max(0, sepia)), a];
            },
            bitDisplay: function (rgbaData, threshold = 128) {
                const [r, g, b, a] = rgbaData;
                const gray = 0.3 * r + 0.59 * g + 0.11 * b;
                const bit = (gray > threshold) ? 1 : 0; // simple binary threshold
                return [bit * 255, bit * 255, bit * 255, a];
            },
            filla0: function (rgbaData, fillRGB = [0, 0, 0], alphaChecker = a => a < 64) {

                // return function (rgbaData) {
                const [r, g, b, a] = rgbaData;
                if (alphaChecker(a))
                    return [...fillRGB, 255]
                return rgbaData
                // }
            },
            invert: function (rgbaData) {
                const [r, g, b, a] = rgbaData;
                return [255 - r, 255 - g, 255 - b, a];
            },
            details: function (rgbaData, detailsLevel = 16) {
                const [r, g, b, a] = rgbaData;
                return [...[r, g, b].map(e => (e % detailsLevel) * Math.floor(255 / detailsLevel)), a];
            },
            enhanceSine: rgbaData => {
                let [r, g, b, a] = rgbaData;
                let avg = (r + g + b) / 3
                let v = (Math.cos(Math.PI * (avg / 255)) + 1) / 2;
                v = (1 - v) * 255;
                return [v, v, v, 255]
            }
        };

        for (const filterName in filters) {
            const filteroption = document.createElement("option");
            filteroption.value = filterName;
            filteroption.textContent = filterName;
            document.getElementById("filterSelector").appendChild(filteroption);
        }

        function applyFilterToCanvas() {
            const filterType = document.getElementById("filterSelector").value;
            applyFilter(filterType);
        }
        function applyFilter(filterType) {
            const selectedFilter = filters[filterType];
            if (!selectedFilter) return; // If the filter is not recognized, do nothing

            modifyCanvas(dC, selectedFilter); // Apply the selected filter to the drawCanvas
        }

        function modifyCanvas(canvas, filterFunction) {
            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height, { willReadFrequently: true });
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                let d = [data[i], data[i + 1], data[i + 2], data[i + 3]];

                [data[i + 0], data[i + 1], data[i + 2], data[i + 3]] = filterFunction(d).map(e => Math.min(255, Math.max(0, e)));
            }
            ctx.putImageData(imageData, 0, 0);
        }

        function modifyCanvas2(canvas, filterFunction) {
            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                let rgbaData = [data[i], data[i + 1], data[i + 2], data[i + 3]];
                const modifiedData = filterFunction(rgbaData);
                data[i] = modifiedData[0];
                data[i + 1] = modifiedData[1];
                data[i + 2] = modifiedData[2];
                data[i + 3] = modifiedData[3];
            }

            ctx.putImageData(imageData, 0, 0); // Update the canvas with modified pixel data
        }

        function applyBWdithering(canvas) {
            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            // Loop through each pixel
            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const i = (y * canvas.width + x) * 4; // Index in the image data array

                    // Get the RGB values of the current pixel
                    let r = data[i];     // Red
                    let g = data[i + 1]; // Green
                    let b = data[i + 2]; // Blue

                    // Convert RGB to grayscale using a simple formula
                    let gray = 0.3 * r + 0.59 * g + 0.11 * b;

                    // Quantize the color (convert to black or white)
                    let newColor = gray > 128 ? 255 : 0;

                    // Set the new color (black or white) for the pixel
                    data[i] = data[i + 1] = data[i + 2] = newColor;

                    // Calculate the error between the original grayscale and the quantized value
                    let error = gray - newColor;

                    // Floyd-Steinberg error diffusion: distribute error to neighboring pixels
                    if (x + 1 < canvas.width) {
                        let iRight = ((y * canvas.width + x + 1) * 4);
                        data[iRight] += error * 7 / 16;
                    }
                    if (y + 1 < canvas.height) {
                        let iDown = (((y + 1) * canvas.width + x) * 4);
                        data[iDown] += error * 5 / 16;
                        if (x - 1 >= 0) {
                            let iDownLeft = (((y + 1) * canvas.width + x - 1) * 4);
                            data[iDownLeft] += error * 3 / 16;
                        }
                        if (x + 1 < canvas.width) {
                            let iDownRight = (((y + 1) * canvas.width + x + 1) * 4);
                            data[iDownRight] += error * 1 / 16;
                        }
                    }
                }
            }

            // Put the modified image data back to the canvas
            ctx.putImageData(imageData, 0, 0);
        }
